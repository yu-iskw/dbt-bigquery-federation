name: "dbt_bigquery_federation_integration_tests"
version: "0.0.1"
config-version: 2

require-dbt-version: [">=1.10.0", "<3.0.0"]

profile: "default"

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
asset-paths: ["assets"]
packages-install-path: "dbt_packages"
clean-targets:
  - "target"
  - "dbt_packages"

flags:
  send_anonymous_usage_stats: false
  use_colors: true
  warn_error_options:
    silence:
      - ProjectFlagsMovedDeprecation
  require_generic_test_arguments_property: true

vars:
  dbt_bigquery_federation:
    connections:
      application_pg:
        connection_id: projects/example/locations/us/connections/application-pg
        provider: cloud_sql_postgres
        defaults:
          schema: public
        types:
          policy: safe
      analytics_alloydb:
        connection_id: projects/example/locations/us/connections/analytics-alloydb
        provider: alloydb_postgres
        defaults:
          schema: public
        types:
          policy: safe
    tables:
      application_pg.public.orders:
        columns:
          - name: id
            data_type: bigint
          - name: amount
            data_type: numeric
            precision: 12
            scale: 2
          - name: created_at
            data_type: timestamp
      analytics_alloydb.public.orders:
        columns:
          - name: id
            data_type: bigint
          - name: user_uuid
            data_type: uuid
          - name: payload
            data_type: jsonb
      application_pg.public.users:
        columns:
          - name: id
            data_type: bigint
          - name: user_uuid
            data_type: uuid
          - name: payload
            data_type: jsonb
      application_pg.public.mixed_decimals:
        columns:
          - name: amount
            data_type: numeric
            precision: 12
            scale: 2
          - name: ratio
            data_type: numeric
      application_pg.public.mystery:
        columns:
          - name: payload
            data_type: citext
      application_pg.public.amounts:
        columns:
          - name: amount
            data_type: numeric
            precision: 12
            scale: 2
      application_pg.public.wide_decimals:
        columns:
          - name: wide_amount
            data_type: numeric
            precision: 40
            scale: 10
          - name: ratio
            data_type: numeric
      application_pg.public.bignumeric_decimals:
        columns:
          - name: wide_amount
            data_type: numeric
            precision: 40
            scale: 10
          - name: wide_fee
            data_type: numeric
            precision: 40
            scale: 10
      application_pg.public.mixed_remaining_decimals:
        columns:
          - name: amount
            data_type: numeric
            precision: 12
            scale: 2
          - name: wide
            data_type: numeric
            precision: 40
            scale: 10
          - name: ratio
            data_type: numeric
      application_pg.public.prices:
        columns:
          - name: price
            data_type: money
      application_pg.public.empty:
        columns: []
      application_pg.public.duplicates:
        columns:
          - name: id
            data_type: bigint
          - name: id
            data_type: text
      application_pg.public.bits:
        columns:
          - name: flags
            data_type: bit
          - name: packed
            data_type: varbit
          - name: masked
            data_type: bit(8)
      application_pg.public.pg_lsn_types:
        columns:
          - name: lsn
            data_type: pg_lsn
      application_pg.public.search_types:
        columns:
          - name: query
            data_type: tsquery
          - name: vector
            data_type: tsvector
          - name: snapshot
            data_type: txid_snapshot
      application_pg.public.int_array:
        columns:
          - name: data
            data_type: integer[]
      application_pg.public.json_native:
        columns:
          - name: payload
            data_type: json
      application_pg.public.uuids:
        columns:
          - name: user_uuid
            data_type: uuid
      application_pg.public.bad_numeric:
        columns:
          - name: amount
            data_type: "numeric(12,2)"
      application_pg.public.poison_cast:
        columns:
          - name: payload
            data_type: text
            strategy: remote_cast
            remote_type: "text;drop"
            target_type: STRING
    type_overrides:
      money:
        strategy: remote_cast
        remote_type: text
        target_type: STRING
      UUID:
        strategy: remote_cast
        remote_type: text
        target_type: STRING

models:
  dbt_bigquery_federation_integration_tests:
    example:
      +materialized: view
    federation:
      +materialized: view
