version: 2

macros:
  - name: federated_relation
    description: >
      Returns a BigQuery EXTERNAL_QUERY table expression. In metadata_mode=auto,
      a declared pin is preferred; otherwise live PostgreSQL-family metadata is
      discovered during connected compilation. metadata_mode=pinned is fully
      deterministic and metadata_mode=live always discovers the remote schema.
    arguments:
      - name: connection
        type: string
        description: Connection alias under vars.dbt_bigquery_federation.connections.
      - name: table
        type: string
        description: Remote table name.
      - name: schema
        type: string
        description: Remote schema; defaults to connection defaults.schema.
      - name: type_policy
        type: string
        description: Optional policy override; safe or strict.
      - name: overrides
        type: dict
        description: Optional mapping of column name to conversion override.
      - name: metadata_mode
        type: string
        description: Optional metadata mode; auto, live, or pinned.

  - name: external_query
    description: >
      Returns a BigQuery EXTERNAL_QUERY table expression for trusted raw remote
      SQL. Does not run the type planner.
    arguments:
      - name: connection
        type: string
        description: Connection alias under vars.dbt_bigquery_federation.connections.
      - name: sql
        type: string
        description: Trusted remote SQL to pass through to EXTERNAL_QUERY.

  - name: get_remote_columns
    description: >
      Discovers and normalizes the current remote relation schema through
      EXTERNAL_QUERY against the provider metadata profile. Currently supported
      by Cloud SQL PostgreSQL and AlloyDB PostgreSQL.
    arguments:
      - name: connection
        type: string
        description: Connection alias.
      - name: table
        type: string
        description: Remote table name.
      - name: schema
        type: string
        description: Optional remote schema.

  - name: federation_inspect
    description: >
      Logs the type-conversion plan. live=true discovers the current source
      schema; live=false plans from the configured pin.
    arguments:
      - name: connection
        type: string
        description: Connection alias.
      - name: schema
        type: string
        description: Remote schema name.
      - name: table
        type: string
        description: Remote table name.
      - name: live
        type: boolean
        description: Discover live metadata when true; otherwise use pins.
      - name: type_policy
        type: string
        description: Optional policy override; safe or strict.
      - name: overrides
        type: dict
        description: Optional column conversion overrides.

  - name: federation_generate_pin
    description: >
      Discovers the live remote schema and prints a vars-compatible tables/columns
      YAML fragment suitable for review and committing to a dbt project.
    arguments:
      - name: connection
        type: string
        description: Connection alias.
      - name: table
        type: string
        description: Remote table name.
      - name: schema
        type: string
        description: Optional remote schema.

  - name: federation_schema_diff
    description: >
      Compares a configured pin with live remote metadata and logs added,
      removed, and type/precision changes.
    arguments:
      - name: connection
        type: string
        description: Connection alias.
      - name: table
        type: string
        description: Remote table name.
      - name: schema
        type: string
        description: Optional remote schema.

  - name: federation_validate
    description: >
      Compares a configured pin with live metadata and optionally fails when
      schema drift is detected.
    arguments:
      - name: connection
        type: string
        description: Connection alias.
      - name: table
        type: string
        description: Remote table name.
      - name: schema
        type: string
        description: Optional remote schema.
      - name: fail_on_drift
        type: boolean
        description: Raise a compiler error on drift when true.
