name: Integration tests
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/integration-tests.yml
      - macros/**/*
      - integration_tests/**/*
      - dbt_project.yml

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        dbt-group: ["dbt-core-1-10", "dbt-core-1-11"]
        adapter: ["postgres"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: dbt_package_template
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dbt_package_template"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: integration_tests
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "integration_tests/pyproject.toml"
          python-version: ${{ matrix.python-version }}

      - name: Run integration tests
        env:
          DBT_POSTGRES_HOST: localhost
          DBT_POSTGRES_PORT: "5432"
          DBT_POSTGRES_USER: postgres
          DBT_POSTGRES_PASSWORD: postgres
          DBT_POSTGRES_DATABASE: dbt_package_template
          DBT_POSTGRES_SCHEMA: dbt_package_template
        run: |
          mkdir -p target
          uv run nox -s "unit_tests-${{ matrix.python-version }}(adapter='${{ matrix.adapter }}', uv_group='${{ matrix.dbt-group }}')"
          uv run nox -s "integration_tests-${{ matrix.python-version }}(adapter='${{ matrix.adapter }}', uv_group='${{ matrix.dbt-group }}')"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs-${{ matrix.python-version }}-${{ matrix.dbt-group }}-${{ matrix.adapter }}
          retention-days: 3
          path: |
            integration_tests/logs
            integration_tests/target

  bigquery-parse:
    name: bigquery parse (${{ matrix.dbt-group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dbt-group: ["dbt-bigquery-1-10", "dbt-bigquery-1-11"]
    defaults:
      run:
        working-directory: integration_tests
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "integration_tests/pyproject.toml"
          python-version: "3.12"

      - name: Parse with dbt-bigquery
        env:
          DBT_BIGQUERY_PROJECT: dbt-bigquery-federation-ci
          DBT_BIGQUERY_DATASET: dbt_bigquery_federation_ci
          DBT_BIGQUERY_LOCATION: US
        run: |
          mkdir -p target
          uv run nox -s "bigquery_compile_tests(uv_group='${{ matrix.dbt-group }}')"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bigquery-parse-logs-${{ matrix.dbt-group }}
          retention-days: 3
          path: |
            integration_tests/logs
            integration_tests/target

  fusion:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: dbt_package_template
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dbt_package_template"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: integration_tests
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "integration_tests/pyproject.toml"
          python-version: ${{ matrix.python-version }}

      - name: Run Fusion tests
        env:
          DBT_POSTGRES_HOST: localhost
          DBT_POSTGRES_PORT: "5432"
          DBT_POSTGRES_USER: postgres
          DBT_POSTGRES_PASSWORD: postgres
          DBT_POSTGRES_DATABASE: dbt_package_template
          DBT_POSTGRES_SCHEMA: dbt_package_template
          # Fusion preview treats postgres as experimental (dbt1005).
          DBT_ALLOW_EXPERIMENTAL_ADAPTERS: "true"
        run: |
          mkdir -p target
          uv run nox -f noxfile_fusion.py -s "fusion_unit_tests-${{ matrix.python-version }}"
          uv run nox -f noxfile_fusion.py -s "fusion_integration_tests-${{ matrix.python-version }}"
