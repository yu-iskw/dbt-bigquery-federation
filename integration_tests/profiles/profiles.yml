default:
  target: postgres
  outputs:
    postgres:
      type: postgres
      host: "{{ env_var('DBT_POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('DBT_POSTGRES_USER', 'postgres') }}"
      password: "{{ env_var('DBT_POSTGRES_PASSWORD', 'postgres') }}"
      dbname: "{{ env_var('DBT_POSTGRES_DATABASE', 'dbt_package_template') }}"
      schema: "{{ env_var('DBT_POSTGRES_SCHEMA', 'dbt_package_template') }}"
      threads: "{{ env_var('DBT_THREADS', '4') | as_number }}"
    bigquery:
      type: bigquery
      method: oauth-secrets
      token: "{{ env_var('DBT_BIGQUERY_TOKEN', 'bigquery-emulator') }}"
      project: "{{ env_var('DBT_BIGQUERY_PROJECT', 'dbt-bigquery-federation-ci') }}"
      dataset: "{{ env_var('DBT_BIGQUERY_DATASET', 'dbt_bigquery_federation_ci') }}"
      location: "{{ env_var('DBT_BIGQUERY_LOCATION', 'US') }}"
      api_endpoint: "{{ env_var('DBT_BIGQUERY_API_ENDPOINT', 'http://127.0.0.1:9050') }}"
      threads: "{{ env_var('DBT_THREADS', '4') | as_number }}"
    bigquery_gcp:
      type: bigquery
      method: oauth
      project: "{{ env_var('DBT_BIGQUERY_PROJECT') }}"
      dataset: "{{ env_var('DBT_BIGQUERY_DATASET', 'dbt_bigquery_federation_e2e') }}"
      location: "{{ env_var('DBT_BIGQUERY_LOCATION', 'us-central1') }}"
      threads: "{{ env_var('DBT_THREADS', '4') | as_number }}"
    duckdb:
      type: duckdb
      path: ":memory:"
      database: "dbt_working_db"
      attach:
        - path: "{{ env_var('DBT_DUCKDB_PATH', 'integration_tests.duckdb') }}"
          alias: "dbt_working_db"
      schema: "{{ env_var('DBT_DUCKDB_SCHEMA', 'dbt_package_template') }}"
      threads: "{{ env_var('DBT_THREADS', '4') | as_number }}"
