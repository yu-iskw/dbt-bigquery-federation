name: "dbt_bigquery_federation_integration_tests"
version: "0.0.1"
config-version: 2

require-dbt-version: [">=1.10.0", "<3.0.0"]

profile: "default"

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
asset-paths: ["assets"]
packages-install-path: "dbt_packages"
clean-targets:
  - "target"
  - "dbt_packages"

flags:
  send_anonymous_usage_stats: false
  use_colors: true
  warn_error_options:
    silence:
      - ProjectFlagsMovedDeprecation
  require_generic_test_arguments_property: true

vars:
  dbt_bigquery_federation:
    connections:
      application_pg:
        connection_id: projects/example/locations/us/connections/application-pg
        provider: cloud_sql_postgres
        defaults:
          schema: public
        types:
          policy: safe
    tables:
      application_pg.public.orders:
        columns:
          - name: id
            data_type: bigint
          - name: amount
            data_type: numeric
            precision: 12
            scale: 2
          - name: created_at
            data_type: timestamp
      application_pg.public.users:
        columns:
          - name: id
            data_type: bigint
          - name: user_uuid
            data_type: uuid
          - name: payload
            data_type: jsonb
      application_pg.public.mixed_decimals:
        columns:
          - name: amount
            data_type: numeric
            precision: 12
            scale: 2
          - name: ratio
            data_type: numeric
      application_pg.public.mystery:
        columns:
          - name: payload
            data_type: citext
      application_pg.public.amounts:
        columns:
          - name: amount
            data_type: numeric
            precision: 12
            scale: 2
      application_pg.public.wide_decimals:
        columns:
          - name: wide_amount
            data_type: numeric
            precision: 40
            scale: 10
          - name: ratio
            data_type: numeric
      application_pg.public.prices:
        columns:
          - name: price
            data_type: money
      application_pg.public.empty:
        columns: []
      application_pg.public.duplicates:
        columns:
          - name: id
            data_type: bigint
          - name: id
            data_type: text
    type_overrides:
      money:
        strategy: remote_cast
        remote_type: text
        target_type: STRING

models:
  dbt_bigquery_federation_integration_tests:
    example:
      +materialized: view
    federation:
      +materialized: view
