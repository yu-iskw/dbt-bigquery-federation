name: Format local GCP E2E

on:
  push:
    branches:
      - automation/format-local-gcp-e2e

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout E2E branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: feat/local-real-gcp-e2e

      - name: Format with Trunk
        continue-on-error: true
        uses: trunk-io/trunk-action@75699af9e26881e564e9d832ef7dc3af25ec031b # v1.2.4
        with:
          post-init: |
            "${TRUNK_PATH}" fmt e2e/run.sh

      - name: Commit formatter output
        if: always()
        run: |
          if git diff --quiet; then
            echo "No formatter changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/run.sh
          git commit -m "Format local E2E runner with Trunk"
          git push origin HEAD:feat/local-real-gcp-e2e
