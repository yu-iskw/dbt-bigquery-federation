services:
  dialect-postgres:
    image: postgres:16
    container_name: dbt-bigquery-federation-dialect-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: federation_dialect
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d federation_dialect"]
      interval: 2s
      timeout: 5s
      retries: 20

  spanner-emulator:
    image: gcr.io/cloud-spanner-emulator/emulator:1.5.55
    container_name: dbt-bigquery-federation-spanner-emulator
    ports:
      - "9010:9010"
      - "9020:9020"
