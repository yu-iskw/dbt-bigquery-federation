version: 2

macros:
  - name: federated_relation
    description: >
      Returns a BigQuery EXTERNAL_QUERY table expression planned from a pin under
      vars.dbt_bigquery_federation.tables (or root vars.yml on dbt 1.12+). Never
      calls run_query. Live discovery belongs on federation_inspect /
      federation_generate_pin / federation_validate. Missing pins fail with an
      actionable compiler error.
    arguments:
      - name: connection
        type: string
        description: Connection alias under vars.dbt_bigquery_federation.connections.
      - name: table
        type: string
        description: Remote table name.
      - name: schema
        type: string
        description: >
          Required remote schema. Use the PostgreSQL/AlloyDB schema name
          (for example public). For Spanner GoogleSQL's default schema, pass
          an empty string.
      - name: type_policy
        type: string
        description: Optional policy override; safe or strict.
      - name: overrides
        type: dict
        description: Optional mapping of column name to conversion override.
      - name: metadata_mode
        type: string
        description: >
          Optional compatibility argument. Only pinned (or omitted) is accepted.
          live and auto raise a compiler error; use run-operation for discovery.

  - name: external_query
    description: >
      Returns a BigQuery EXTERNAL_QUERY table expression for trusted raw remote
      SQL. Does not run the type planner.
    arguments:
      - name: connection
        type: string
        description: Connection alias under vars.dbt_bigquery_federation.connections.
      - name: sql
        type: string
        description: Trusted remote SQL to pass through to EXTERNAL_QUERY.

  - name: get_remote_columns
    description: >
      Discovers and normalizes the current remote relation schema through
      EXTERNAL_QUERY against the provider metadata profile. Supported by
      Cloud SQL PostgreSQL, AlloyDB PostgreSQL, and Spanner GoogleSQL.
    arguments:
      - name: connection
        type: string
        description: Connection alias.
      - name: table
        type: string
        description: Remote table name.
      - name: schema
        type: string
        description: >
          Required remote schema. Empty string targets Spanner GoogleSQL's
          default schema.

  - name: federation_inspect
    description: >
      Logs the type-conversion plan. live=true discovers the current source
      schema; live=false plans from the configured pin.
    arguments:
      - name: connection
        type: string
        description: Connection alias.
      - name: schema
        type: string
        description: >
          Required remote schema. Empty string targets Spanner GoogleSQL's
          default schema.
      - name: table
        type: string
        description: Remote table name.
      - name: live
        type: boolean
        description: Discover live metadata when true; otherwise use pins.
      - name: type_policy
        type: string
        description: Optional policy override; safe or strict.
      - name: overrides
        type: dict
        description: Optional column conversion overrides.

  - name: federation_generate_pin
    description: >
      Discovers the live remote schema and prints a vars-compatible tables/columns
      YAML fragment suitable for review and committing to a dbt project.
      Emits numeric precision/scale and character_maximum_length only when those
      typmods apply; integer and float information_schema bit-widths are omitted.
    arguments:
      - name: connection
        type: string
        description: Connection alias.
      - name: table
        type: string
        description: Remote table name.
      - name: schema
        type: string
        description: >
          Required remote schema. Empty string targets Spanner GoogleSQL's
          default schema.

  - name: federation_schema_diff
    description: >
      Compares a configured pin with live remote metadata and logs added,
      removed, and type/precision/length changes. Integer and float
      information_schema bit-widths are ignored; numeric typmods and
      character lengths are compared. Pin data_type aliases are normalized
      with the connection provider.
    arguments:
      - name: connection
        type: string
        description: Connection alias.
      - name: table
        type: string
        description: Remote table name.
      - name: schema
        type: string
        description: >
          Required remote schema. Empty string targets Spanner GoogleSQL's
          default schema.

  - name: federation_validate
    description: >
      Compares a configured pin with live metadata and optionally fails when
      schema drift is detected. Drift uses the same comparable type signature
      as federation_schema_diff.
    arguments:
      - name: connection
        type: string
        description: Connection alias.
      - name: table
        type: string
        description: Remote table name.
      - name: schema
        type: string
        description: >
          Required remote schema. Empty string targets Spanner GoogleSQL's
          default schema.
      - name: fail_on_drift
        type: boolean
        description: Raise a compiler error on drift when true.
